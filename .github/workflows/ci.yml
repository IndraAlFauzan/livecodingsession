# Menjalankan pemeriksaan yang sama untuk ketiga bagian setiap kali kode masuk.
# Backend memakai node:sqlite bawaan Node, jadi versi Node minimal 22.
#
# NONAKTIF untuk sekarang: akun GitHub terkunci karena masalah penagihan,
# jadi runner tidak pernah menyala dan setiap commit akan ditandai merah.
# Selama itu pakai ./scripts/check.sh yang menjalankan urutan yang sama.
#
# MENGHIDUPKAN LAGI setelah penagihan beres: hapus tanda komentar pada dua
# baris `push:` dan `pull_request:` di bawah ini.
#
# Alur yang dituju: kerjakan di branch fitur, buka PR ke main. CI jadi syarat
# merge, jadi apa pun yang masuk main sudah diperiksa.
name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-coding-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: live-coding-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-coding-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: live-coding-backend/package-lock.json
      - run: npm ci

      # Server dinyalakan dan diuji dalam satu langkah supaya prosesnya pasti hidup.
      - name: Nyalakan server lalu jalankan smoke test
        env:
          TEACHER_TOKEN: token-ci
          PORT: "3000"
          DB_PATH: ${{ runner.temp }}/ci.db
          PUBLIC_BASE_URL: http://localhost:5174
        run: |
          node src/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          server=$!
          # trap, bukan kill di akhir: di bawah `bash -e` baris setelah tes yang
          # gagal tidak pernah dieksekusi, jadi servernya akan tertinggal hidup.
          # PID eksplisit, bukan %1, supaya tidak bergantung pada tabel job shell.
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Timeout supaya masalah jaringan gagal cepat, bukan menggantung 6 jam.
          ready() { curl -sf --connect-timeout 2 --max-time 5 http://localhost:3000/health > /dev/null; }

          for _ in $(seq 1 30); do
            ready && break
            sleep 1
          done
          if ! ready; then
            echo "Server tidak kunjung siap:"
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          fi

          npm test

      - name: Log server bila gagal
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" || true

  extension:
    name: Extension (compile + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-coding-classroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: live-coding-classroom/package-lock.json
      - run: npm ci
      - run: npm run compile
      # Membungkus memastikan kontribusi package.json dan berkas resources valid.
      - run: npx --yes @vscode/vsce package --allow-missing-repository --out /tmp/extension.vsix
